# =========================================
# KITTY — DRACULA + HYPRLAND
# =========================================

# Fonte
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Cursor
cursor_shape block
cursor_blink_interval 0.5

# =========================================
# DRACULA
# =========================================

foreground              #F8F8F2
background              #282A36

selection_foreground    #282A36
selection_background    #44475A

cursor                  #F8F8F2
cursor_text_color       #282A36

# Cores normais
color0  #21222C
color1  #FF5555
color2  #50FA7B
color3  #F1FA8C
color4  #BD93F9
color5  #FF79C6
color6  #8BE9FD
color7  #F8F8F2

# Cores brilhantes
color8  #6272A4
color9  #FF6E6E
color10 #69FF94
color11 #FFFFA5
color12 #D6ACFF
color13 #FF92DF
color14 #A4FFFF
color15 #FFFFFF

# =========================================
# TRANSPARÊNCIA
# =========================================

background_opacity 0.50

# Desfoca o fundo atrás do Kitty
background_blur 10

# =========================================
# JANELA
# =========================================

# Sem borda extra
window_padding_width 8

# Espaçamento entre abas
tab_bar_edge top
tab_bar_style powerline

# =========================================
# SCROLLBACK
# =========================================

scrollback_lines 10000

# =========================================
# PERFORMANCE
# =========================================

repaint_delay 10
input_delay 3
sync_to_monitor yes
